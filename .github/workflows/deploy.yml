# Redeploys treflestudio.com on every push to main.
#
# The VPS runs Docker Compose (/docker/trefle-studio-nextjs). Its `app` service
# clones this repo, builds and starts Next.js when the container is created, so
# a deploy is just recreating that container. The SSH key used here is locked
# on the VPS (authorized_keys `command=`) to that single compose command.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Recreate app container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        # The forced command on the VPS runs the redeploy; nothing is sent here.
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "root@$VPS_HOST"

      - name: Wait for the site to come back
        # The container clones, installs and builds before serving: allow ~10 min.
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://treflestudio.com/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "treflestudio.com did not return 200 within 10 minutes"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
