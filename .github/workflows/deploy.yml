# Redeploys treflestudio.com on every push to main.
#
# The VPS runs Docker Compose (/docker/trefle-studio-nextjs, files in deploy/).
# deploy/deploy.sh builds the new image while the current container keeps
# serving, then swaps containers; Caddy holds requests during the swap, so
# there is no downtime. The SSH key used here is locked on the VPS
# (authorized_keys `command=`) to that script.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Queue instead of cancel: killing a deploy mid-swap could leave the app down.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build and swap on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        # The forced command on the VPS runs deploy.sh; nothing is sent here.
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 "root@$VPS_HOST"

      - name: Check the site
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://treflestudio.com/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "treflestudio.com did not return 200 within 2 minutes"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
