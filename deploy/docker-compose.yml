# Lives on the VPS at /docker/trefle-studio-nextjs/docker-compose.yml.
# Keep that folder name: it is the compose project name, and Caddy's
# certificates are stored in the project's caddy_data volume.
services:
  app:
    build:
      context: https://github.com/Messie88/Trefle-Studio.git#main
    image: trefle-studio-app:latest
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
